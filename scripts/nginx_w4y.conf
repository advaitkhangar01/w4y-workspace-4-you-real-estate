# scripts/nginx_w4y.conf
# Nginx Configuration Template for W4Y Platform
#
# DEPLOY NOTE: After editing this file, copy to VPS and reload:
#   sudo cp nginx_w4y.conf /etc/nginx/sites-available/w4y
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name yourdomain.com; # Replace with your configured domain

    # -------------------------------------------------------------------------
    # Upload size limit — must be >= multer MAX_FILE_SIZE (200 MB)
    # Required for CAD files, ZIP bundles, plotting exports, BOQ spreadsheets
    # -------------------------------------------------------------------------
    client_max_body_size 250M;

    # -------------------------------------------------------------------------
    # Gzip Compression — accelerates React bundle & static assets transfer
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # API proxy -> Node on 3001
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Extended timeouts for large file uploads
        proxy_read_timeout    300s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    300s;

        # Buffer settings — disable buffering for streaming uploads
        proxy_request_buffering off;
    }

    # Static file serving for uploaded documents
    location /uploads/ {
        alias /var/www/w4y/server/uploads/;

        # Prevent execution of uploaded files — serve as download only
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";

        # Disable directory listing
        autoindex off;

        # Cache static uploads for 7 days
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # All other requests -> Node (serves React SPA)
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}

# After setup, run: certbot --nginx -d yourdomain.com
